#executor: parallel

tasks:
  - source: tasks/preprocessing.py
    product:
      nb: "{{folder_output}}/preprocessing.ipynb"
      x: "{{folder_output}}/preprocessing/xwide_{{missingvals}}.xlsx"
      x_long: "{{folder_output}}/preprocessing/xlong_{{missingvals}}.xlsx"
      x_lag: "{{folder_output}}/preprocessing/xlag_{{missingvals}}.xlsx"
      y: "{{folder_output}}/preprocessing/y_{{missingvals}}.xlsx"
      xy: "{{folder_output}}/preprocessing/xy_{{missingvals}}.xlsx"
      xy_wide: "{{folder_output}}/preprocessing/xywide_{{missingvals}}.xlsx"
      xlag_y: "{{folder_output}}/preprocessing/xlagy_{{missingvals}}.xlsx"
    params:
      in_vitro_folder: "{{in_vitro_folder}}"
      in_vivo_folder: "{{in_vivo_folder}}"
      in_vivo_sheet: "BMD_mass_TT"
      n_neighbors: 5
      scaler_type_x: "power"
      scaler_type_y: "power"
      threshold: 0.66
      #missingvals: "impute"
      missingvals: "{{missingvals}}"

  - source: tasks/cluster.py
    name : "cluster-[[cluster_method]]"
    product:
      nb: "{{folder_output}}/cluster/notebook_[[cluster_method]].ipynb"
      data: "{{folder_output}}/cluster/cluster-[[cluster_method]]"
      stats: "{{folder_output}}/cluster/stats_[[cluster_method]].xlsx"
    grid:
      cluster_method: ["spectral","kmeans","agglomerative"]
    params:
      # min_cluster_size: 10 was default
      # try 4 clusters - cnt, silica, bentonite, metal oxides
      min_cluster_size: 10
    params:
      dataset: "x"


  - source: tasks/cluster_compare.py
    name : "compare_clusters"
    product:
      nb: "{{folder_output}}/cluster/notebook.ipynb"
      data: "{{folder_output}}/cluster/labels.xlsx"
      stats: "{{folder_output}}/cluster/stats.xlsx"


  - source: tasks/scikit_pipe.py
    name: "scikit_[[model]]_[[in_vivo_cell]]_[[in_vivo_time]]_[[in_vitro_assay]]_[[in_vitro_cell]]_C[[cluster_label]]"
    product:
      nb: "{{folder_output}}//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/notebook_{{dataset}}.ipynb"
      data: "{{folder_output}}//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/data_{{dataset}}.xlsx"
      #model: "{{folder_output}}//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/model_{{dataset}}.pkl"
      metrics: "{{folder_output}}//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/metrics_{{dataset}}.xlsx"
      plot: "{{folder_output}}//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/plot_{{dataset}}.png"
      plot_m: "{{folder_output}}//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/plot_materials_{{dataset}}.png"
    #      model: "{{folder_output}}//[[in_vivo_cell]]//scikit_[[model]]_[[in_vivo_time]]/model.pkl"
    params:
      dataset: "{{dataset}}"
      clean_products: False
      log_transform: False
      predict_all: True
      param_search: True
      cv_LOGO: 0
      cv_KFOLD: 5
      cv_MATERIAL: 1             
    grid:
#      in_vivo_cell : ["ALL", "Neutrophil","Macrophage", "Lymphocyte", "Epithelial", "Eosinophil"]
      in_vivo_cell : ["Neutrophil", "Macrophage", "Lymphocyte",]
      in_vivo_time : [1, 3, 28]
      in_vitro_assay: ['DAPI', '8OHG', 'CTG', 'CASP', 'H2AX']
      in_vitro_cell: ['ALL']
      #model: ["GPR"]
      model: ["XGB","RF"]
      #cluster_label: ["ALL",0,1,2]
      cluster_label: [0,1,2]



  - source: tasks/scikit_pipe.py
    name: "model_[[model]]_[[in_vivo_cell]]_[[in_vivo_time]]_[[in_vitro_assay]]_[[in_vitro_cell]]_C[[cluster_label]]"
    product:
      nb: "{{folder_output}}//model//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/notebook_{{dataset}}.ipynb"
      data: "{{folder_output}}//model//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/data_{{dataset}}.xlsx"
      model: "{{folder_output}}//model//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/model_{{dataset}}.pkl"
      metrics: "{{folder_output}}//model//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/metrics_{{dataset}}.xlsx"
      plot: "{{folder_output}}//model//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/plot_{{dataset}}.png"
      plot_m: "{{folder_output}}//model//[[in_vivo_cell]]//[[in_vitro_assay]]//[[in_vitro_cell]]//scikit_[[model]]_[[in_vivo_time]]_C[[cluster_label]]/plot_materials_{{dataset}}.png"
    #      model: "{{folder_output}}//[[in_vivo_cell]]//scikit_[[model]]_[[in_vivo_time]]/model.pkl"
    params:
      dataset: "{{dataset}}"
      clean_products: True
      log_transform: False
      predict_all: True
      param_search: False
      cv_LOGO: 0
      cv_KFOLD: 5
      cv_MATERIAL: 1      
    grid:
      in_vivo_cell : ["Neutrophil"]
      in_vivo_time : [1]
      in_vitro_assay: ['ALL']
      in_vitro_cell: ['ALL']
      #model: ["GPR"]
      model: ["XGB","RF"]
      #cluster_label: ["ALL",0,1,2]
      cluster_label: ["ALL"]



  - source: tasks/metrics_compare.py
    product:
      nb: "{{folder_output}}/metrics_compare_{{missingvals}}.ipynb"
      data: "{{folder_output}}/metrics_compare_{{missingvals}}.xlsx"

  - source: tasks/bmd_variance.py
    product:
      nb: "{{folder_output}}/bmd_variance.ipynb"
      bmd_variance: "{{folder_output}}/bmd_variance.csv"
    params:
      in_vivo_folder: "{{in_vivo_folder}}"

  - source: tasks/aop_graph.py
    product:
      nb: "{{folder_output}}/aop_graph.ipynb"
      aop_graph: "{{folder_output}}/aop_graph"
    params:
      aop_file: "{{aop_file}}"

